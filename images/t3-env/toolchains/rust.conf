# Rust toolchains (rustup). The first is the default.
# TOOLCHAINS=minimal installs only the first, without extra targets.
RUST_TOOLCHAINS="stable beta nightly"
RUST_COMPONENTS="rust-src rustfmt clippy rust-analyzer llvm-tools"
RUST_TARGETS="wasm32-unknown-unknown wasm32-wasip1 x86_64-unknown-linux-musl"
