# PHP versions from packages.sury.org. The first is the default `php`;
# the others are available as php8.3, php8.5, ...
# TOOLCHAINS=minimal installs only the first.
PHP_VERSIONS="8.4 8.3 8.5"
# Extensions installed for every version (skipped where a version has them built in).
PHP_EXTENSIONS="cli common curl mbstring intl xml zip gd bcmath readline opcache sqlite3 pgsql mysql redis"
