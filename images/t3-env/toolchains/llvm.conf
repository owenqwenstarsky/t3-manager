# LLVM/Clang majors from apt.llvm.org. The first is the default `clang` and
# also gets lldb, libc++ and libc++abi. The others get clang, lld, clangd,
# clang-format and clang-tidy (as clang-N, ...); libc++ dev packages can't be
# installed for two versions at once.
# TOOLCHAINS=minimal installs only the first.
LLVM_VERSIONS="23 22"
