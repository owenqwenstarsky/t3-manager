name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @t3m/dashboard typecheck
      - run: pnpm --filter @t3m/dashboard test
      - run: pnpm --filter @t3m/dashboard build

  proxy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/proxy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/proxy/go.mod
          cache-dependency-path: services/proxy/go.sum
      - run: test -z "$(gofmt -l t3ext cmd/server sdk/auth/t3_codex_device.go)"
      - run: go vet ./t3ext/ ./sdk/auth/ ./cmd/server/
      - run: go test ./t3ext/ ./sdk/auth/
      - run: CGO_ENABLED=0 go build -o /dev/null ./cmd/server

  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: proxy
            context: services/proxy
            file: services/proxy/Dockerfile.t3
          - name: dashboard
            context: .
            file: apps/dashboard/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  # The full environment image is ~10-13 GB, more than a hosted runner has
  # room for, so CI builds the minimal variant (same scripts, one version per
  # language) and runs the smoke test in it.
  t3-env:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: images/t3-env
          push: false
          load: true
          tags: t3-env:ci
          build-args: TOOLCHAINS=minimal
          secrets: github_token=${{ secrets.GITHUB_TOKEN }}
          cache-from: type=gha,scope=t3-env
          cache-to: type=gha,mode=max,scope=t3-env
      - run: docker run --rm --user dev --entrypoint /usr/local/lib/t3m/smoke.sh -e SMOKE_NETWORK=1 t3-env:ci

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          shellcheck -x images/t3-env/entrypoint.sh images/t3-env/lib/*.sh images/t3-env/install/*.sh \
            images/t3-env/test/smoke.sh images/t3-env/profile/bashrc.sh \
            apps/dashboard/docker-entrypoint.sh services/proxy/t3ext/docker-entrypoint.sh
